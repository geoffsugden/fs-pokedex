name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - name: Run npm test
        run: npm test
      - name: Build App
        run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright Tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip')}}
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
  notify_success:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Success
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip')}}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.PERSONAL_DISCORD_WEBHOOK }}
  tag_release:
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha}}
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: v
          DEFAULT_BUMP: patch
  notify_failure:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build_and_test.result == 'failure' }}
    steps:
      - name: Notify Failure
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.PERSONAL_DISCORD_WEBHOOK }}
          status: Failure
          title: 'Failure Details'
          description: |
            Repository ${{ github.repository }} 
            Branch: ${{ github.ref_name }} 
            Commit: ${{ github.sha }} 
            Message: ${{ github.event.head_commit.message }} || ${{ github.event.pull_request.title }}
            Author: ${{ github.actor }} 
            Workflow ${{ github.workflow }} 
            Job: simple_deployment_pipeline
